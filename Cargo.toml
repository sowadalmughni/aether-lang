[workspace]
resolver = "2"
members = [
    "aether-core",
    "aether-compiler",
    "aether-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Md. Sowad Al-Mughni"]
license = "MIT"
repository = "https://github.com/sowadalmughni/aether-lang"

[workspace.dependencies]
# Internal crates
aether-core = { path = "aether-core" }

# Shared dependencies across crates
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
clap = { version = "4.4", features = ["derive"] }
chrono = "0.4"

# Workspace-wide lint configuration. We run `cargo clippy -- -D warnings`
# in CI; the lints below are pre-existing patterns we don't want to
# rewrite as part of the build/CI overhaul. Each should be treated as
# tech-debt and removed individually.
[workspace.lints.clippy]
manual_strip = "allow"
needless_range_loop = "allow"
inherent_to_string = "allow"
only_used_in_recursion = "allow"

[workspace.lints.rust]
# Anthropic API structs in aether-runtime/src/llm.rs are only referenced
# under the `llm-api` feature; without it they look dead.
dead_code = "allow"
