# Error-injection corpus for the type-safety ablation.
#
# Each entry pairs an .aether file with two Python equivalents (LangChain and
# DSPy) that mirror the same logical bug. The type-safety ablation runner reads
# this manifest, runs `aetherc check` on every .aether file, runs each Python
# equivalent as a subprocess, and emits a per-bug breakdown into
# bench/results/ablation_typesafety_v1.json.
#
# Buckets:
#   type_mismatch        (10) - SemanticError::TypeMismatch
#   undefined_reference  (10) - SemanticError::UndefinedSymbol / UndefinedFunction
#   missing_field        ( 5) - SemanticError::UnknownField / ArgumentCountMismatch
#   duplicate_definition ( 5) - SemanticError::DuplicateDefinition / DuplicateField /
#                                DuplicateParameter / DuplicateVariant
# Total: 30. The original spec called for `circular_dependency` instead of
# `duplicate_definition`; that substitution and its rationale are documented
# in https://github.com/sowadalmughni/aether-lang/issues/4 and in the
# methodology footer of bench/results/ablations_v1.md.
#
# expected_python_detection legend:
#   runtime         - Python is expected to raise an exception when the bug is exercised.
#   silent          - Python is expected to complete without raising; output is wrong but no signal.
#   either          - either outcome is plausible depending on framework version / mock LLM.
# The runner records the *actual* observed behavior; this field documents
# author intent only.

corpus:
  - id: tm_01
    bucket: type_mismatch
    expected_aether_error_classes: [TypeMismatch]
    description: "Flow returns a string literal where a struct is expected."
    python_lc_path: lc/tm_01.py
    python_dspy_path: dspy/tm_01.py
    expected_python_detection: silent

